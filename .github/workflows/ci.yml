name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Vet
        run: go vet ./...
      - name: 7-Zip, which the zip tests check encryption against
        run: sudo apt-get install -y -qq 7zip
      - name: Test
        # Some tests open a game window; Xvfb is the screen they open on.
        run: xvfb-run -a go test ./...
      - name: Test without cgo
        run: CGO_ENABLED=0 go test ./...
      - name: Static build
        run: make static
      - name: Builds for other platforms, without cgo
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o /dev/null ./cmd/tlua
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -o /dev/null ./cmd/tlua
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o /dev/null ./cmd/tlua

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Test
        run: go test ./...

  alpine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build and try the musl release
        run: docker run --rm -v "$PWD":/src -w /src alpine:3.22 scripts/build-alpine.sh 0.0.0-ci

  # Not yet tried by hand: a failure here is a warning, as in the release.
  windows:
    runs-on: windows-2022
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Build (MinGW)
        shell: msys2 {0}
        run: scripts/build-release.sh 0.0.0-ci
      - name: Smoke test
        shell: bash
        run: |
          cd dist
          7z x -bso0 *.zip >/dev/null
          exe=$(ls */tlua.exe)
          "$exe" -v
          "$exe" -e 'assert(require("gui") and (1 + 1 == 2))'
